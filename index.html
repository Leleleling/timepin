<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 首屏默认值；React 挂载后由 useDocumentPreferences 按主题色与语言覆盖。 -->
    <meta name="theme-color" content="#E5484D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 安装到主屏幕的名称是静态的，用中英通用的品牌名，不写死单一语言。 -->
    <meta name="apple-mobile-web-app-title" content="TimePin" />
    <meta
      name="description"
      content="时光扣 TimePin — 用紧急度重新排列你的每一天。本地优先，离线完全可用。"
    />
    <title>时光扣 · TimePin</title>
    <script>
      // GitHub Pages 静态托管下刷新 /calendar 等深链会命中 404.html；
      // 那里先把原始路径存进 sessionStorage，这里在 React 挂载前还原，保持干净的 BrowserRouter URL。
      (function () {
        try {
          var raw = sessionStorage.getItem('timepin:spa-redirect');
          if (!raw) return;
          sessionStorage.removeItem('timepin:spa-redirect');
          var target = JSON.parse(raw);
          if (target && typeof target.path === 'string' && target.path.charAt(0) === '/') {
            history.replaceState(null, '', target.path + (target.search || '') + (target.hash || ''));
          }
        } catch (error) {
          console.error('[timepin] Unable to restore SPA route', error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
